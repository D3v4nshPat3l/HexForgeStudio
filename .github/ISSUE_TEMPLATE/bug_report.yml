name: Bug report
description: Report a reproducible problem in HexForge Studio Pro
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not upload confidential, copyrighted, malicious, or personally sensitive sample files. Describe the smallest safe reproduction possible.
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: HexForge version or commit
      placeholder: 2.1.0 or commit SHA
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Microsoft Edge
        - Google Chrome
        - Mozilla Firefox
        - Safari
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: Paste relevant browser-console errors. Remove sensitive data first.
      render: shell
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues before opening this report.
          required: true
        - label: I removed confidential data and unsafe sample files.
          required: true
